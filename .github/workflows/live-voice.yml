name: Read-only hosted-call proof diagnostic
on:
  workflow_dispatch:
    inputs:
      aut_call_id:
        required: true
      driver_call_id:
        required: true
      marker:
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install inkbox==0.5.9
      - name: Read persisted call predicates
        env:
          AUT_INKBOX_API_KEY: ${{ secrets.CODEX_INKBOX_API_KEY }}
          REMOTE_INKBOX_API_KEY: ${{ secrets.REMOTE_INKBOX_API_KEY }}
          INKBOX_BASE_URL: ${{ vars.INKBOX_BASE_URL }}
          AUT_CALL_ID: ${{ inputs.aut_call_id }}
          DRIVER_CALL_ID: ${{ inputs.driver_call_id }}
          EXPECTED_MARKER: ${{ inputs.marker }}
        run: python tests/ci/inspect_hosted_call.py
