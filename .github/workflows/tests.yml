name: PR checks — unit · contract

on:
  push:
    branches: [main]
  pull_request:                     # catches PRs from feature branches → main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Offline unit suite. No codex binary installed → the contract tests auto-skip,
  # and the live tests skip without API keys. Fast signal on our own code — cheap
  # enough to run on every push, including draft PRs (the heavy live suite is what
  # we gate).
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v8.1.0

      # Live helper regressions exercise the SDK's real pagination offline.
      - name: Install test deps
        run: uv pip install --system pytest httpx aiohttp segno "inkbox==0.7.11" "audioop-lts>=0.2.1; python_version >= '3.13'"

      - name: Run unit tests
        run: pytest -q

  # Exercise Slack request and response contracts against the released SDK floor.
  slack-sdk:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install bridge and released SDK
        run: >-
          uv pip install --system -e . pytest httpx "inkbox==0.7.11"
      - name: Require provisioning-workspace and identity-subscription support
        run: |
          python - <<'PY'
          import inspect
          from inkbox.slack import SlackResource
          from inkbox.webhook_subscriptions import WebhookSubscriptionsResource
          assert callable(SlackResource.list_provisioning_workspaces)
          assert callable(SlackResource.set_processing_status)
          assert callable(SlackResource.remove_reaction)
          assert "scope" in inspect.signature(WebhookSubscriptionsResource.list).parameters
          PY
      - name: Slack onboarding, routing, signed receiver, and SDK contracts
        run: >-
          pytest -q tests/test_setup_slack.py tests/test_setup_wizard.py
          tests/test_prompts.py tests/test_slack.py tests/test_slack_activity.py tests/test_slack_harness.py
          tests/test_tools.py::test_coding_agent_tool_tier_is_registered

  # Optional native replies use the real SDK contract without raising the
  # released SDK floor for operators who leave the feature disabled.
  imessage-sdk:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bridge and pinned native-reply SDK preview
        run: >-
          pip install -e . pytest httpx
          "inkbox @ git+https://github.com/inkbox-ai/inkbox.git@b4cc89e7aecd782d44c97f4214f3e9a322ee962a#subdirectory=sdk/python"
      - name: Require native reply support
        run: |
          python - <<'PY'
          from inkbox.agent_identity import AgentIdentity
          from inkbox_codex.config import imessage_threading_capability
          supported, detail = imessage_threading_capability(AgentIdentity)
          assert supported, detail
          PY
      - name: Native reply, burst, recovery, and real SDK contracts
        run: >-
          pytest -q tests/test_imessage_tools.py tests/test_imessage_sessions.py
          tests/test_imessage_state.py tests/test_imessage_gateway.py
          tests/test_imessage_sdk.py tests/test_companion.py

  # Contract suite against the REAL Codex host at its freshest main cut. This is
  # the lane that catches upstream drift in the app-server protocol (a renamed
  # method, a moved result field, a dropped notification) before it reaches a
  # user. Same suite the canary runs on a schedule; this is the per-PR gate.
  contract-pr:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install bridge + test deps
        run: |
          uv pip install --system \
            "inkbox==0.7.11" \
            -e . pytest

      # @alpha is the prerelease channel cut from codex main near-daily — the
      # freshest main build available without compiling the host from source.
      - name: Install Codex (freshest main prerelease)
        run: bash "$GITHUB_WORKSPACE/tests/ci/install_codex.sh"

      - name: Contract tests vs real Codex
        run: pytest tests/contract -v

  # Exercise complete Companion initialization with the released SDK and real
  # host, using the same supported SDK floor as the other verification lanes.
  companion-sdk:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install released SDK and test dependencies
        run: >-
          uv pip install --system -e . pytest httpx
          "inkbox==0.7.11"
      - name: Verify helper is present (do not silently skip its tests)
        run: python -c "from inkbox.companion import CompanionResource; assert callable(CompanionResource.load_initialization)"
      - name: Install Codex (freshest main prerelease)
        run: bash "$GITHUB_WORKSPACE/tests/ci/install_codex.sh"
      - name: Run unit and host suites including actual SDK pagination
        run: pytest -q
