name: Canary - plugin vs pinned Codex

# Validate the pinned host before running the full-stack suites.
on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install bridge + test deps
        run: |
          uv pip install --system \
            "inkbox==0.7.27" \
            -e . pytest

      - name: Install pinned Codex
        run: bash "$GITHUB_WORKSPACE/tests/ci/install_codex.sh"

      # Live tests self-skip without credentials; the complete live stack runs
      # only after this pinned-host canary succeeds.
      - name: Full offline suite vs real Codex
        run: pytest -q
